name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_run:
    types:
      - completed
    workflows:
      - "Update WIT"

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Set up wasm-tools
        uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          # The generated src/bindings/plugin.wit is printed by wasm-tools, keep this in
          # sync with what `zig build gen` was last run with.
          version: "1.259.0"

      - name: Format
        run: zig fmt --check build.zig src tools examples

      - name: Test
        run: zig build test --summary all

      - name: Generated bindings are up to date
        run: |
          set -eux
          zig build gen
          git diff --exit-code -- src/bindings

      - name: Compile every binding
        run: zig build check

      - name: Build examples
        run: |
          set -eux
          zig build
          for plugin in zig-out/*.wasm; do wasm-tools validate "$plugin"; done

      - name: Upload examples
        uses: actions/upload-artifact@v7
        with:
          name: example-plugins
          path: zig-out/*.wasm
